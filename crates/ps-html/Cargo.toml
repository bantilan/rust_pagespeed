[package]
name = "ps-html"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sha2 = "0.10"
ps-cache = { path = "../ps-cache" }
ps-config = { path = "../ps-config" }
ps-css = { path = "../ps-css" }
ps-http = { path = "../ps-http" }
ps-image = { path = "../ps-image" }
ps-js = { path = "../ps-js" }
ps-stats = { path = "../ps-stats" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "rewrite"
harness = false

[[bench]]
name = "background"
harness = false

[features]
pipeline-profile = []
