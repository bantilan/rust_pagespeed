load_module @MODULE@;
worker_processes 1;
daemon off;
master_process off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log notice;
events { worker_connections 128; }
http {
include /etc/nginx/mime.types;
access_log off;
pagespeed FileCachePath @PREFIX@/cache;
pagespeed MessageBufferSize 100000;
pagespeed InPlaceSMaxAgeSec 300;
server {
    listen       @PORT@;
    server_name  localhost;
    root /var/www;
pagespeed on;
pagespeed HtmlCache on;
pagespeed HtmlCacheTtlSec 300;
pagespeed ShowCacheTimestamp on;
pagespeed Statistics on;
pagespeed StatisticsLogging on;  # unsupported by rust port
pagespeed EnableCachePurge on;
pagespeed AdminPath /pagespeed_admin;


location = /pagespeed_admin {
    allow 127.0.0.1;
    allow ::1;
    deny all;
}

location ^~ /pagespeed_admin/ {
    allow 127.0.0.1;
    allow ::1;
    deny all;
}

# Beacon needs rewrites to run (PassThrough prevents it).
pagespeed RewriteLevel CoreFilters;

# Your existing filters.
pagespeed DisableFilters lazyload_images;
pagespeed EnableFilters prioritize_lcp_images;
pagespeed EnableFilters inline_css;
# Negotiate AVIF where accepted; rewrite_images supplies WebP and JPEG fallback.
pagespeed EnableFilters rewrite_images,convert_to_avif,convert_jpeg_to_webp;
pagespeed EnableFilters insert_ga;
pagespeed EnableFilters strip_legacy_polyfills;
pagespeed SupportNoScriptEnabled off;
# Enable at least one qualifying image filter for critical beacon path.
pagespeed EnableFilters lazyload_images;
# or use delay_images / inline_images / resize_rendered_image_dimensions

pagespeed CriticalImagesBeaconEnabled true;
pagespeed AnalyticsID GT-3249232;

    
    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /var/www;
        index  index.html index.htm;
        expires 5m;
    }
location /test/ {
    root /var/www;
    index index.html index.htm;
    expires 5m;
}
    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}


}
